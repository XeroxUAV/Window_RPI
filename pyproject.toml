[project]
name = "window-rpi"
version = "0.1.0"
description = "Raspberry Pi MAVLink bridge and camera streaming scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymavlink>=2.4.40",
    "websockets>=12.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

# Raspberry Pi hardware deps. Not installable off-Pi, so kept optional to keep
# `uv sync` working on development machines.
[project.optional-dependencies]
rpi = ["picamera2>=0.3.22"]

[tool.uv]
package = false